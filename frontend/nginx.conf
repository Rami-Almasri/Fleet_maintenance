# =============================================================================
# FleetView web tier. Single entrypoint for the whole app:
#   /                     → React SPA (static, with client-side routing)
#   /api, /sanctum, /up   → Laravel (php-fpm at backend:9000)
#   /storage/*            → user-uploaded media (inspection photos, repair videos)
# =============================================================================

upstream php-fpm {
    server backend:9000;
}

server {
    listen 80;
    server_name _;

    # Sized for maintenance repair videos — keep in step with the PHP
    # upload_max_filesize / post_max_size (backend/docker/uploads.ini).
    client_max_body_size 256M;

    # Compress text assets (images/video are already compressed).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ---- SPA -----------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted CRA build assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- User-uploaded media (local `public` disk) --------------------------
    # Served straight from the shared storage volume (bypasses the symlink).
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- Laravel API + health -----------------------------------------------
    # Everything the backend owns is routed to php-fpm. The app lives at
    # /var/www/html inside the BACKEND container — php-fpm resolves this path
    # on its own filesystem, so nginx needs no PHP files locally.
    location ~ ^/(api|sanctum|up|broadcasting)(/|$) {
        # Base params first, then override only what Laravel's single front
        # controller needs (order matters — later directives win).
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # OM/Sheets syncs run on the scheduler (CLI), but allow slow API calls.
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---- SPA client-side routing fallback -----------------------------------
    # Any non-file, non-API path returns the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not leak dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
