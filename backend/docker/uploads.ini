; Upload limits sized for maintenance repair videos + inspection photo sets.
; Keep in step with nginx `client_max_body_size` (see frontend/nginx.conf).
upload_max_filesize=256M
post_max_size=256M
max_file_uploads=40

; Long enough for large multipart uploads; OM/Sheets syncs run on the CLI
; (scheduler), not the web request path, so this stays modest.
max_execution_time=120
memory_limit=512M
