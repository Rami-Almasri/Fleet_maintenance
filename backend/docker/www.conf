; php-fpm pool overrides for the FleetView backend.
[www]
; CRITICAL: keep environment variables from docker-compose `env_file` visible
; to the app. The default php-fpm pool clears them, which would blank out
; DB_*, OFFICEMANAGER_*, GOOGLE_* etc. at runtime.
clear_env = no

; Process manager — tuned for a small/medium single-server deployment. Raise
; pm.max_children on bigger boxes (rule of thumb: RAM_for_php / ~64MB per child).
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker errors in the container log.
catch_workers_output = yes
decorate_workers_output = no
