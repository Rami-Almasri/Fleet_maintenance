; Production OPcache — code is immutable inside the image, so timestamp
; validation is disabled for maximum throughput. Rebuild the image to ship
; new code (the entrypoint also re-runs config/route/view cache on boot).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1
